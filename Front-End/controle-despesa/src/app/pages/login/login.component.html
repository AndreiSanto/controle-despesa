<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="form" (ngSubmit)="login()">
    <input type="email" placeholder="Email"  name="email" formControlName="email">
    <input type="password" placeholder="Senha"  name="password" formControlName="password">
    <button type="submit" (submit)="login()">Entrar</button>
  </form>
</div>
<p-toast></p-toast>
